<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 16 104 80" role="img" aria-label="homenet-bridge">
  <!-- One-colour glyph, no tile: Android notification icon, monochrome favicon, icon tiles.
       Uses currentColor so it takes the colour of the text around it when inlined. -->
