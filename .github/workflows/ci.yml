name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: shellcheck install.sh
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck install.sh
      # Windows is only built, not tested: the bridge has not been tried there yet.
      - name: Cross-build
        if: matrix.os == 'ubuntu-latest'
        run: GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/homenet-bridge
