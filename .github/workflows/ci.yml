name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # The newest 1.25 patch: go.mod says 1.25.0, which setup-go would take literally.
          go-version: "1.25.x"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: Menu bar app
        if: matrix.os == 'macos-latest'
        working-directory: macos
        run: swift build -c release
      - name: shellcheck install.sh
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck install.sh
      # Windows is only built, not tested: the bridge has not been tried there yet.
      - name: Cross-build
        if: matrix.os == 'ubuntu-latest'
        run: GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/homenet-bridge

  # The library the Android app is built on. The runner image has the SDK, NDK and a JDK.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # The newest 1.25 patch: go.mod says 1.25.0, which setup-go would take literally.
          go-version: "1.25.x"
      - name: Android library
        run: ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME make aar
      - uses: actions/upload-artifact@v4
        with:
          name: homenet-bridge-aar
          path: build/homenet-bridge.aar
